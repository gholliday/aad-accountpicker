<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .count {
      font-size: 48px;
      font-weight: bold;
      color: #c00;
    }
    .label {
      font-size: 14px;
      color: #333;
      margin-bottom: 10px;
    }
    .since {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
    }
    .config {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      text-align: left;
      font-size: 12px;
    }
    .config label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="count" id="count">0</div>
  <div class="label">clicks saved</div>
  <div class="since" id="since"></div>
  <div class="config">
    <label>
      <input type="checkbox" id="delayEnabled">
      Delay 3s before picking account
    </label>
    <label style="margin-top: 8px;">
      <input type="checkbox" id="emailAutoSubmit">
      Auto-submit email after 4s
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
