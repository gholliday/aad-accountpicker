<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .count {
      font-size: 48px;
      font-weight: bold;
      color: #c00;
    }
    .label {
      font-size: 14px;
      color: #333;
      margin-bottom: 10px;
    }
    .breakdown {
      font-size: 11px;
      color: #666;
      text-align: left;
      margin-top: 10px;
      line-height: 1.6;
    }
    .breakdown-item {
      display: flex;
      justify-content: space-between;
    }
    .since {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
    }
    .config {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      text-align: left;
      font-size: 12px;
    }
    .config label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .actions {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }
    .toggle-status {
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
    }
    .toggle-button.enabled {
      background: #fee;
      border-color: #d99;
      color: #900;
    }
    .toggle-button.disabled {
      background: #e8f5e9;
      border-color: #9ccc9c;
      color: #1b5e20;
    }
    button {
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
    }
    button:hover {
      background: #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="count" id="count">0</div>
  <div class="label">clicks saved</div>
  <div class="breakdown" id="breakdown"></div>
  <div class="since" id="since"></div>
  <div class="config">
    <label>
      <input type="checkbox" id="delayEnabled">
      Delay 3s before picking account
    </label>
    <label style="margin-top: 8px;">
      <input type="checkbox" id="emailAutoSubmit">
      Auto-submit email after 4s
    </label>
  </div>
  <div class="actions">
    <div class="toggle-status" id="toggleStatus">Extension is enabled</div>
    <button class="toggle-button" id="toggleButton">Disable Extension</button>
    <div style="margin-top: 10px;">
    <button id="resetButton">Reset All Data</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
